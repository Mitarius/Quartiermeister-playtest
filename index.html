<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quartiermeister — Команда и экспедиции</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1e26;color:#f3ebd5;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#20434a,#0c1e26 70%)}
    .mark{font:700 72px Georgia,serif;color:#e4b86d;margin-bottom:20px}.brand{font-size:clamp(22px,4vw,38px);letter-spacing:6px;margin:0}.tagline{color:#aabbb2;letter-spacing:2px;font-size:13px;margin:20px 0 44px}
    progress{width:320px;max-width:80vw;height:4px;border:0;background:#25454a;accent-color:#e4b86d;margin:auto}progress::-webkit-progress-bar{background:#25454a}progress::-webkit-progress-value{background:#e4b86d}
    #status{font-size:13px;color:#aabbb2;margin-top:18px}#error{display:none;max-width:560px;margin:20px auto;color:#ffd3ab;white-space:pre-wrap}button{padding:12px 24px;background:#e4b86d;border:0;color:#182e34;cursor:pointer;margin:12px auto}
    #mobile{display:none;position:absolute;bottom:10px;width:100%;text-align:center;font-size:12px;color:#b4c8c2;pointer-events:none}@media(max-width:700px){#mobile{display:block}}
    @media(max-aspect-ratio:4/3){canvas{height:75vw;position:absolute;top:50%;transform:translateY(-50%)}#mobile{display:block}}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Quartiermeister: пиратская команда и экспедиции"></canvas>
  <div id="loading"><div class="mark">Q /</div><h1 class="brand">QUARTIERMEISTER</h1><p class="tagline">КОРАБЛЬ — ЭТО КОМАНДА</p><progress id="progress" max="1" value="0"></progress><p id="status">Поднимаем паруса…</p><div id="error"></div></div>
  <div id="mobile">Для первого прототипа используйте компьютер и горизонтальное окно.</div>
  <script>
    const started = performance.now();
    const buildVersion = '0.3.0';
    window.quartiermeisterMetrics = {version: buildVersion, userAgent: navigator.userAgent, viewport: [innerWidth, innerHeight], errors: []};
    window.quartiermeisterReady = () => {
      requestAnimationFrame(() => {
        window.quartiermeisterMetrics.firstFrameMs = Math.round(performance.now() - started);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('unity-canvas').focus();
        console.info('Quartiermeister ready', JSON.stringify(window.quartiermeisterMetrics));
      });
    };
    function showError(message) {
      window.quartiermeisterMetrics.errors.push(String(message));
      document.getElementById('loading').style.display = 'grid';
      document.getElementById('status').textContent = 'Не удалось открыть гавань';
      const error = document.getElementById('error'); error.style.display = 'block';
      error.textContent = 'Попробуйте актуальный Chrome или Edge с включённым WebGL 2.\n\n' + String(message);
      if (!document.getElementById('retry')) { const retry=document.createElement('button'); retry.id='retry'; retry.textContent='Попробовать снова'; retry.onclick=()=>location.reload(); error.append(document.createElement('br'),retry); }
    }
    const canvas = document.getElementById('unity-canvas');
    canvas.addEventListener('webglcontextlost', () => showError('Графический контекст потерян. Перезагрузите страницу.'));
    const script = document.createElement('script');
    script.src = 'Build/Web.loader.js?v=' + buildVersion;
    script.onerror = () => showError('Загрузчик игры недоступен. Проверьте соединение.');
    script.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/Web.data.unityweb?v=' + buildVersion,
      frameworkUrl: 'Build/Web.framework.js.unityweb?v=' + buildVersion,
      codeUrl: 'Build/Web.wasm.unityweb?v=' + buildVersion,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Third Half', productName: 'Quartiermeister', productVersion: buildVersion,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => { if (type === 'error') showError(message); else console.warn(message); }
    }, progress => {
      document.getElementById('progress').value = progress;
      document.getElementById('status').textContent = progress < 0.9 ? 'Готовим гавань… ' + Math.round(progress * 100) + '%' : 'Встречаем команду…';
    }).then(instance => { window.unityInstance = instance; }).catch(showError);
    document.body.appendChild(script);
  </script>
</body>
</html>
